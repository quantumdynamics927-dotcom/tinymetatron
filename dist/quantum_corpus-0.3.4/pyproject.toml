[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-corpus"
version = "0.3.4"
description = "RAG pipeline and corpus tools for quantum research copilot"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Quantum Dynamics", email = "quantumdynamics927@users.noreply.github.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["quantum", "rag", "bm25", "retrieval", "ibm-quantum"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]
advanced = [
    "numpy>=1.26",
    "sentence-transformers>=2.2",
    "pymupdf>=1.24",
]

[project.urls]
Homepage = "https://github.com/quantumdynamics927-dotcom/TinyMetatron"
Documentation = "https://github.com/quantumdynamics927-dotcom/TinyMetatron#readme"
Repository = "https://github.com/quantumdynamics927-dotcom/TinyMetatron"
Issues = "https://github.com/quantumdynamics927-dotcom/TinyMetatron/issues"

[tool.setuptools]
packages = ["quantum_corpus", "quantum_corpus.eval"]

[tool.setuptools.package-data]
quantum_corpus = ["py.typed"]
"quantum_corpus.eval" = ["py.typed"]
