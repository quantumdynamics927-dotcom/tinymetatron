[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-corpus"
version = "0.4.0"
description = "RAG pipeline and corpus tools for quantum research copilot"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Quantum Dynamics", email = "quantumdynamics927@users.noreply.github.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["quantum", "rag", "bm25", "retrieval", "ibm-quantum", "corpus", "freeze"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=5.0",
    # fastapi.testclient -> starlette.testclient requires httpx; the test
    # suite's API tests fail to import without it.
    "httpx>=0.27",
]
advanced = [
    "numpy>=1.26",
    "sentence-transformers>=2.2",
    "pymupdf>=1.24",
]

[project.scripts]
quantum-corpus-freeze = "quantum_corpus.freeze:main"
quantum-corpus-validate = "quantum_corpus.freeze:validate_main"

[project.urls]
Homepage = "https://github.com/quantumdynamics927-dotcom/TinyMetatron"
Documentation = "https://github.com/quantumdynamics927-dotcom/TinyMetatron#readme"
Repository = "https://github.com/quantumdynamics927-dotcom/TinyMetatron"
Issues = "https://github.com/quantumdynamics927-dotcom/TinyMetatron/issues"

[tool.setuptools]
packages = ["quantum_corpus", "quantum_corpus.eval"]

[tool.setuptools.package-data]
quantum_corpus = ["py.typed", "data/*.json"]
"quantum_corpus.eval" = ["py.typed"]

# ── Test configuration ───────────────────────────────────────────────────────
# `testpaths` keeps a bare `pytest` run scoped to the project's own suite.
# Without it pytest walks the whole tree and tries to collect vendored
# third-party checkouts under experiments/exp-005/corpus-rev4/repos/, which
# produced 374 collection errors.
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
norecursedirs = [
    "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}",
    "ckpt", "data_v2", "eval", "experiments", "frontend", "state", "tokenizers",
]
addopts = "-ra --strict-markers"

# ── Coverage ────────────────────────────────────────────────────────────────
# `source` lists exactly the modules the test suite imports and measures.
# Modules with no test coverage at all are deliberately excluded so they
# cannot mask regressions in the covered code:
#   manage_data, migrate_source_identity, train_pilot_tokenizer,
#   quantum_corpus.{build,extract,split,tokenize_count}, quantum_corpus.eval.*
#   (the eval harness — its scripts are Windows-path bound and are excluded
#   from collection), loops.{feedback,generalize,promote,train}_loop,
#   workers.evaluate.*, workers.train.*.
# Add them here as tests land.
#
# Known blind spot: workers/corpus/{validate,split,version,corpus_gate} run as
# subprocesses, and coverage.py does not trace child processes. They are
# exercised by tests/test_corpus_loop.py but are therefore not listed here —
# naming them would only produce "module was never imported" warnings.
[tool.coverage.run]
source = [
    "api",
    "config",
    "db",
    "metatron_compiler",
    "metatron_global_memory",
    "metatron_moe",
    "metatron_shard",
    "metatron_sparse_attention",
    "quality",
    "tinymetatron_model",
    "tokenizer",
    "train_db",
    "quantum_corpus.answer",
    "quantum_corpus.freeze",
    "quantum_corpus.fusion",
    "quantum_corpus.rag",
    "quantum_corpus.redact",
    "quantum_corpus.schema",
    "quantum_corpus.secrets",
    "quantum_corpus.semantic",
    "quantum_corpus.structured",
    "quantum_corpus.eval.build_canaries",
    "loops.corpus_loop",
    "workers.corpus.convert_qcorpus",
    "workers.corpus.dedupe",
]
branch = true

[tool.coverage.report]
fail_under = 40
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

