name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.12 matches the local dev venv; 3.13 matches the Dockerfile base
        # image and the PyPI publish workflow; 3.11 is the oldest version in
        # the project's classifiers. CPU-only torch wheels exist for all three.
        python-version: [ "3.11", "3.12", "3.13" ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU-only PyTorch
        # The pinned torch is installed from the CPU index FIRST, so that
        # `pip install -r requirements.txt` finds torch==<pin> already
        # satisfied and does not pull the CUDA build from PyPI. The version is
        # read from requirements.txt so the two cannot drift apart.
        run: |
          python -m pip install --upgrade pip
          TORCH_PIN="$(grep -E '^torch==' requirements.txt | cut -d= -f3)"
          echo "Installing torch==${TORCH_PIN} (CPU-only)"
          pip install "torch==${TORCH_PIN}" --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Install test tooling
        # The `dev` extra carries pytest, pytest-cov and httpx. httpx is
        # required by fastapi.testclient -> starlette.testclient; without it
        # tests/test_api.py fails at import time.
        run: pip install -e ".[dev]"

      - name: Run test suite with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Enforce coverage floor
        run: coverage report --fail-under=40

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
