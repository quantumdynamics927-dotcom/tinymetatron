name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-python:
    name: pip-audit (Python dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Check for vulnerable Python packages
        run: |
          # Scan requirements.txt if it exists, else scan all installed packages
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --format=columns
          else
            pip-audit --format=columns
          fi
        continue-on-error: true

  audit-frontend:
    name: npm audit (Frontend dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: hashFiles('frontend/package.json') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Check for vulnerable npm packages
        uses: a flynn/npm-audit@v2
        with:
          args: --audit-level=high
        continue-on-error: true

  codeql:
    name: CodeQL (Python + JS)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Build
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
